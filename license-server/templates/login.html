<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MAI License Server Login</title>
    <style>
      body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: grid; place-items: center; min-height: 100vh; }
      .card { width: min(420px, 90vw); background: #111827; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
      input, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
      button { background: #0ea5e9; border: none; font-weight: bold; cursor: pointer; }
      .flash { background: #7f1d1d; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>MAI License Server</h2>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
        {% endif %}
      {% endwith %}
      <form method="post">
        <input name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
