name: manufacturing-agentic-ai

services:
  postgres-manufacturing:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_MANUFACTURING_USER:-mai_app}
      POSTGRES_PASSWORD: ${POSTGRES_MANUFACTURING_PASSWORD:?Set POSTGRES_MANUFACTURING_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_manufacturing_data:/var/lib/postgresql/data
    networks:
      - mai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres-video:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_VIDEO_USER:-mai_video}
      POSTGRES_PASSWORD: ${POSTGRES_VIDEO_PASSWORD:?Set POSTGRES_VIDEO_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_video_data:/var/lib/postgresql/data
    networks:
      - mai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  init-postgres-manufacturing:
    image: mokshbj/manufacturing-agentic-ai-postgres-init:latest
    restart: "no"
    environment:
      PGHOST: postgres-manufacturing
      PGUSER: ${POSTGRES_MANUFACTURING_USER:-mai_app}
      PGPASSWORD: ${POSTGRES_MANUFACTURING_PASSWORD:?Set POSTGRES_MANUFACTURING_PASSWORD in .env}
      TARGET_DATABASE: ${POSTGRES_MANUFACTURING_DB:-manufacturing_ai}
      BACKUP_FILE: /backups/manufacturing_ai.sql
    depends_on:
      postgres-manufacturing:
        condition: service_healthy
    networks:
      - mai_internal
    command: ["/bin/bash", "/usr/local/bin/init-postgres.sh"]

  init-postgres-video:
    image: mokshbj/manufacturing-agentic-ai-postgres-init:latest
    restart: "no"
    environment:
      PGHOST: postgres-video
      PGUSER: ${POSTGRES_VIDEO_USER:-mai_video}
      PGPASSWORD: ${POSTGRES_VIDEO_PASSWORD:?Set POSTGRES_VIDEO_PASSWORD in .env}
      TARGET_DATABASE: ${POSTGRES_VIDEO_DB:-construction_ai}
      BACKUP_FILE: /backups/construction_ai_backup.sql
    depends_on:
      postgres-video:
        condition: service_healthy
    networks:
      - mai_internal
    command: ["/bin/bash", "/usr/local/bin/init-postgres.sh"]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
    volumes:
      - sqlserver_data:/var/opt/mssql
      # Shared volume so the .bak is visible to SQL Server for RESTORE
      - sqlserver_backups:/var/opt/mssql/backup
    networks:
      - mai_internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  init-sqlserver:
    image: mokshbj/manufacturing-agentic-ai-sqlserver-init:latest
    restart: "no"
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-mes_new}
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
    volumes:
      # Same shared volume – init copies the image's .bak here
      - sqlserver_backups:/var/opt/mssql/backup
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - mai_internal
    # Fixed init: copy .bak into shared volume, then restore using a path
    # that the SQL Server process can actually see.
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        SERVER="$${SQLSERVER_HOST:?SQLSERVER_HOST is required}"
        DATABASE="$${SQLSERVER_DATABASE:?SQLSERVER_DATABASE is required}"
        USER_NAME="$${SQLSERVER_USER:-sa}"
        PASSWORD="$${SQLSERVER_PASSWORD:?SQLSERVER_PASSWORD is required}"
        # Path inside the *SQL Server* container (shared volume)
        BACKUP=/var/opt/mssql/backup/mes_new.bak
        IMAGE_BACKUP=/backups/mes_new.bak

        if [ "$${#PASSWORD}" -lt 8 ] || [[ ! "$$PASSWORD" =~ [A-Z] ]] || [[ ! "$$PASSWORD" =~ [a-z] ]] || [[ ! "$$PASSWORD" =~ [0-9] ]] || [[ ! "$$PASSWORD" =~ [^a-zA-Z0-9] ]]; then
          echo "[ERROR] SQLSERVER_PASSWORD must be at least 8 characters and contain uppercase, lowercase, number, and symbol characters." >&2
          exit 1
        fi

        run_sql() { "$$SQLCMD" -C -b -S "$$SERVER" -U "$$USER_NAME" -P "$$PASSWORD" -Q "$$1"; }

        echo "[INFO] Waiting for SQL Server authentication..."
        for attempt in $$(seq 1 60); do
          if run_sql 'SELECT 1' >/dev/null 2>&1; then break; fi
          if [ "$$attempt" = 60 ]; then echo '[ERROR] SQL Server did not accept authenticated connections.' >&2; exit 1; fi
          sleep 2
        done
        echo "[INFO] SQL Server is ready."

        if run_sql "SELECT 1 FROM sys.databases WHERE name = N'$$DATABASE'" -h -1 -W | grep -q 1; then
          echo "[INFO] SQL Server database '$$DATABASE' already exists; preserving existing data."
          exit 0
        fi

        # Make the backup visible to the SQL Server process
        echo "[INFO] Copying MES backup into shared volume for SQL Server..."
        mkdir -p /var/opt/mssql/backup
        cp -f "$$IMAGE_BACKUP" "$$BACKUP"
        chmod 644 "$$BACKUP"

        echo "[INFO] MES database not found; reading logical files from backup."
        mapfile -t files < <("$$SQLCMD" -C -b -S "$$SERVER" -U "$$USER_NAME" -P "$$PASSWORD" -h -1 -W -s '|' -Q "RESTORE FILELISTONLY FROM DISK = N'$$BACKUP'" | awk -F'|' 'NF >= 3 { gsub(/^[ \t]+|[ \t]+$$/, "", $$1); gsub(/^[ \t]+|[ \t]+$$/, "", $$3); if ($$3 == "D" || $$3 == "L") print $$1 "|" $$3 }')
        if [ "$${#files[@]}" -eq 0 ]; then echo '[ERROR] Could not read logical file names from MES backup.' >&2; exit 1; fi

        moves=(); data_index=0; log_index=0
        for entry in "$${files[@]}"; do
          logical=$${entry%%|*}; type=$${entry##*|}
          if [ "$$type" = D ]; then suffix="$${data_index}.mdf"; data_index=$$((data_index + 1)); else suffix="$${log_index}.ldf"; log_index=$$((log_index + 1)); fi
          moves+=("MOVE N'$$logical' TO N'/var/opt/mssql/data/$${DATABASE}_$${suffix}'")
        done

        restore="RESTORE DATABASE [$$DATABASE] FROM DISK = N'$$BACKUP' WITH $$(IFS=,; echo "$${moves[*]}"), RECOVERY, REPLACE"
        echo "[INFO] Restoring SQL Server database '$$DATABASE'."
        run_sql "$$restore"
        run_sql "SELECT name FROM sys.databases WHERE name = N'$$DATABASE'"
        echo "[INFO] SQL Server database '$$DATABASE' restored and verified."

  backend:
    image: mokshbj/manufacturing-agentic-ai-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_MANUFACTURING_USER:-mai_app}:${POSTGRES_MANUFACTURING_PASSWORD}@postgres-manufacturing:5432/${POSTGRES_MANUFACTURING_DB:-manufacturing_ai}
      CONSTRUCTION_DB_URL: postgresql+psycopg2://${POSTGRES_VIDEO_USER:-mai_video}:${POSTGRES_VIDEO_PASSWORD}@postgres-video:5432/${POSTGRES_VIDEO_DB:-construction_ai}
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_SERVER: sqlserver,1433
      DB_NAME: ${SQLSERVER_DATABASE:-mes_new}
      DB_TRUSTED_CONNECTION: "no"
      DB_ENCRYPT: "no"
      DB_TRUST_SERVER_CERTIFICATE: "yes"
      SQLSERVER_USER: ${SQLSERVER_USER:-sa}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      REPORT_APPROVAL_EMAIL_SECRET: ${REPORT_APPROVAL_EMAIL_SECRET:?Set REPORT_APPROVAL_EMAIL_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_RELOAD: "false"
      DATABASE_STARTUP_TIMEOUT_SECONDS: "60"
    volumes:
      - backend_reports:/app/reports
      - backend_logs:/app/logs
    depends_on:
      init-postgres-manufacturing:
        condition: service_completed_successfully
      init-postgres-video:
        condition: service_completed_successfully
      init-sqlserver:
        condition: service_completed_successfully
    networks:
      - mai_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: mokshbj/manufacturing-agentic-ai-frontend:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mai_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  mai_internal:
    driver: bridge

volumes:
  postgres_manufacturing_data:
  postgres_video_data:
  sqlserver_data:
  sqlserver_backups:          # NEW – shared between sqlserver & init-sqlserver
  backend_reports:
  backend_logs: